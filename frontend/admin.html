<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guess the Word — Admin Reports">
    <title>Admin Reports — Guess the Word</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header" style="max-width: 800px;">
        <h1>Admin Reports</h1>
        <div class="user-info">
            <span id="username-display"></span>
            <a href="game.html" class="btn btn-secondary" style="width:auto; padding:8px 16px; font-size:0.85rem; text-decoration:none;">Play Game</a>
            <button id="logout-btn" class="btn btn-secondary" style="width:auto; padding:8px 16px; font-size:0.85rem;">Logout</button>
        </div>
    </div>

    <div class="admin-container">
        <!-- Error / Status Message -->
        <div id="message" class="message" style="width:100%; max-width:800px; margin-bottom:20px;"></div>

        <!-- Section 1: Daily Report -->
        <div class="report-section">
            <h3>Daily Report</h3>
            <table class="report-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Users</th>
                        <th>Correct Guesses</th>
                    </tr>
                </thead>
                <tbody id="daily-report-body">
                    <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Loading daily report...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Section 2: User Report -->
        <div class="report-section">
            <h3>User Report</h3>
            <table class="report-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Username</th>
                        <th>Words Tried</th>
                        <th>Correct Guesses</th>
                    </tr>
                </thead>
                <tbody id="user-report-body">
                    <tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Loading user report...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
